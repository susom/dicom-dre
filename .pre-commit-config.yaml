default_language_version:
  python: python3.12
fail_fast: false
default_stages: [pre-commit, pre-push, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: check for added large files
        description: prevents giant files (for example DICOM binaries) from being committed.
        entry: check-added-large-files
        language: python
        exclude: '^(uv\.lock|src/dicom_dre/resources/allow_lists/default\.csv)$'
      - id: check-toml
        name: check toml
        description: checks toml files for parseable syntax.
        entry: check-toml
        language: python
        types: [toml]
      - id: check-yaml
        name: check yaml
        description: checks yaml files for parseable syntax.
        entry: check-yaml
        language: python
        types: [yaml]
      - id: end-of-file-fixer
        name: fix end of files
        description: ensures that a file is either empty, or ends with one newline.
        entry: end-of-file-fixer
        language: python
        types: [text]
        exclude: '^(docs/|.*\.py$)' # Python files are handled by ruff
      - id: detect-private-key
        name: detect private key
        description: detects the presence of private keys.
        entry: detect-private-key
        language: python
        types: [text]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        name: ruff linter
        args: [--fix]
        files: '^(src|tests)/'
        types: [python]
        stages: [manual] # Only run when explicitly called, not during commit
      - id: ruff-format
        name: ruff formatter
        files: '^(src|tests)/'
        types: [python]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        types: [python]
        args: [--py312-plus]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, build, chore, ci, docs, feat, fix, perf, refactor, style, test]
  - repo: local
    hooks:
      - id: block-dicom-content
        name: block DICOM content
        description: refuses to commit any file carrying the DICOM magic (DICM at byte offset 128), even if misnamed.
        entry: bash
        language: system
        args: [-c, 'for f in "$@"; do if [ "$(dd if="$f" bs=1 skip=128 count=4 2>/dev/null)" = "DICM" ]; then echo "Refusing to commit DICOM file $f"; exit 1; fi; done', --]
        stages: [pre-commit]
