name: Tests

# Reusable test workflow. Single source of truth for the test job, invoked by
# the CI workflow (pull requests) and the deploy pipeline (release gating).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Exclude the docs group (a default group locally) from CI installs.
      UV_NO_GROUP: docs
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_pypi: true
          use_oidc: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
