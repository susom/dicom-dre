name: Tests

# Reusable test workflow. Single source of truth for the test job, invoked by
# the CI workflow (pull requests) and the deploy pipeline (release gating).

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Exclude the docs group (a default group locally) from CI installs.
      UV_NO_GROUP: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
