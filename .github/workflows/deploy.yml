name: Deploy

# Versioning and PyPI distribution via python-semantic-release, configured under
# [tool.semantic_release] in pyproject.toml.
#
# Pushes to `main` release and publish; pushes to `development` run the test and
# osv-scan gate only. No prerelease versions are produced.
#
# Release gating: the version, build, and release jobs run only after the tests
# and vulnerability scan pass, and nothing is tagged or published until every
# distribution builds. A failed build leaves the repository untouched.

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  osv-scan:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock

  version:
    needs: [test, osv-scan]
    # Only `main` produces releases. Pushes to `development` stop after the test
    # and osv-scan gate, so no version, build, or publish occurs.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      released: ${{ steps.compute.outputs.released }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and tags are required for commit parsing and version
          # derivation.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Compute next version
        id: compute
        run: |
          set -euo pipefail
          PSR="python-semantic-release>=10.5.3,<11"
          NEXT="$(uvx --from "$PSR" semantic-release version --print)"
          LAST="$(uvx --from "$PSR" semantic-release version --print-last-released)"
          TAG="$(uvx --from "$PSR" semantic-release version --print-tag)"
          echo "computed next=${NEXT} last=${LAST} tag=${TAG}"
          # --print emits the current version when no release is warranted, so a
          # value equal to the last released version means "nothing to release".
          if [ -z "${NEXT}" ] || [ "${NEXT}" = "${LAST}" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build_wheels:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # Linux x86_64
          - os: ubuntu-24.04-arm   # Linux aarch64 (ARM64)
          - os: macos-14           # macOS arm64 (Apple Silicon)
          - os: windows-latest     # Windows x86_64
    env:
      # No git tag exists yet, so hatch-vcs (setuptools-scm) cannot derive the
      # version from history. Supply it explicitly. The generic variable covers
      # all builders; the package-specific variable takes precedence where
      # honored.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DICOM_DRE: ${{ needs.version.outputs.version }}
      # Forward the pretend-version variables from the host into the manylinux
      # build containers (Linux only; macOS/Windows build on the host runner).
      CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DICOM_DRE
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        # The build[uv] frontend needs uv on PATH. cibuildwheel provisions it
        # inside the Linux build containers automatically, but on the macOS and
        # Windows host runners it must be installed explicitly.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DICOM_DRE: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  release:
    needs: [version, build_wheels, build_sdist]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    outputs:
      # Whether python-semantic-release actually cut a release. Downstream jobs
      # gate on this rather than the version job's prediction so they never run
      # against an empty artifact set.
      released: ${{ steps.release.outputs.released }}
      # base64-encoded sha256 subjects of the published distributions, consumed
      # by the provenance job to generate SLSA build provenance.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@d17e3a9a36850ea89f35db16c1067dd2b68ee343 # v4.0.1
        with:
          application_id: ${{ secrets.APP_ID }}
          application_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download all distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10
        with:
          github_token: ${{ steps.get_workflow_token.outputs.token }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          changelog: true

      - name: Publish to PyPI
        # Uses PyPI Trusted Publishing (OIDC); configure a trusted publisher for
        # this repository/workflow on PyPI (no API token secret required).
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

      - name: Sign distributions with Sigstore
        # Keyless signing via the workflow's OIDC identity (id-token: write).
        # Produces a <artifact>.sigstore.json bundle next to each wheel and the
        # sdist.
        if: steps.release.outputs.released == 'true'
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          # This is a push event, not a release event; sign the explicit inputs
          # only and do not attach to the auto-generated source archives.
          release-signing-artifacts: false

      - name: Upload distributions to the GitHub Release
        # Uploads the wheels, sdist, and the Sigstore .sigstore.json bundles.
        # Uses the application token (contents: write via the GitHub App) so the
        # job's GITHUB_TOKEN can remain read-only.
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/* --clobber

      - name: Compute distribution hashes for provenance
        # base64-encoded sha256 subjects covering the published wheels and
        # sdist. Consumed by the provenance job to attest the exact artifacts.
        # Written outside dist/ so the checksum file is not uploaded as an asset.
        id: hash
        if: steps.release.outputs.released == 'true'
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz | base64 -w0 > "${RUNNER_TEMP}/subjects.b64"
          echo "hashes=$(cat "${RUNNER_TEMP}/subjects.b64")" >> "$GITHUB_OUTPUT"

  provenance:
    # Generate SLSA build provenance and attach it to the GitHub Release as a
    # <name>.intoto.jsonl asset. This is a separate attestation from the
    # Sigstore signature bundles and is required for the OpenSSF Scorecard
    # Signed-Releases provenance criterion.
    #
    # The generic generator reusable workflow must be referenced by an
    # immutable release tag, not a commit SHA; the trusted builder identity is
    # derived from the tag, so SHA pinning would break provenance verification.
    needs: [version, release]
    if: needs.release.outputs.released == 'true'
    permissions:
      actions: read     # read the workflow run context recorded in provenance
      id-token: write   # keyless signing of the provenance bundle
      contents: write   # attach the provenance to the GitHub Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.version.outputs.tag }}
      provenance-name: dicom_dre-${{ needs.version.outputs.version }}.intoto.jsonl

  deploy_docs:
    # Publish the documentation after a release completes, building from the
    # release tag so hatch-vcs derives the exact released version.
    needs: [version, release]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write   # push the assembled site to the gh-pages branch
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
