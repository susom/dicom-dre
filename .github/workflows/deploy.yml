name: Deploy

# Automated versioning and distribution driven by python-semantic-release.
#
# Pushes to `main` create release versions (e.g. 1.2.0).
# Pushes to `development` create pre versions (e.g. 1.2.0-dev.1).
#
# The version, tag format, and branch/prerelease rules are configured under
# [tool.semantic_release] in pyproject.toml.
#
# Release gating: nothing is tagged, committed, or released until every
# distribution builds successfully. The `version` job computes the next version
# without side effects; the build jobs stamp that version into the artifacts via
# hatch-vcs's pretend-version mechanism (no tag exists yet); and only after all
# builds succeed does the `release` job actually bump the version, write the
# changelog, push the tag, create the GitHub Release, and upload the built
# wheels and sdist. If any build fails, the repository is left untouched (no
# tag, no commit, no release).

on:
  push:
    branches:
      - main
      - development

# Prevent overlapping deploys on the same branch.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    # Compute the next version without modifying the repository. Determines
    # whether a release is warranted and the version/tag that would result.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      released: ${{ steps.compute.outputs.released }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags are required for commit parsing and version
          # derivation.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Compute next version
        id: compute
        run: |
          set -euo pipefail
          PSR="python-semantic-release>=10.5.3,<11"
          NEXT="$(uvx --from "$PSR" semantic-release version --print)"
          LAST="$(uvx --from "$PSR" semantic-release version --print-last-released)"
          TAG="$(uvx --from "$PSR" semantic-release version --print-tag)"
          echo "computed next=${NEXT} last=${LAST} tag=${TAG}"
          # --print emits the current version when no release is warranted, so a
          # value equal to the last released version means "nothing to release".
          if [ -z "${NEXT}" ] || [ "${NEXT}" = "${LAST}" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build_wheels:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # Linux x86_64
          - os: ubuntu-24.04-arm   # Linux aarch64 (ARM64)
          - os: macos-14           # macOS arm64 (Apple Silicon)
          - os: windows-latest     # Windows x86_64
    env:
      # No git tag exists yet, so hatch-vcs (setuptools-scm) cannot derive the
      # version from history. Supply it explicitly. The generic variable covers
      # all builders; the package-specific variable takes precedence where
      # honored.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DICOM_DRE: ${{ needs.version.outputs.version }}
      # Forward the pretend-version variables from the host into the manylinux
      # build containers (Linux only; macOS/Windows build on the host runner).
      CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DICOM_DRE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        # The build[uv] frontend needs uv on PATH. cibuildwheel provisions it
        # inside the Linux build containers automatically, but on the macOS and
        # Windows host runners it must be installed explicitly.
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DICOM_DRE: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  release:
    # First job that mutates the repository. Runs only after every distribution
    # has built. Tags, commits the changelog, pushes, creates the GitHub
    # Release, and uploads the built artifacts.
    needs: [version, build_wheels, build_sdist]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tags, commits, and GitHub Releases
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags are required for commit parsing and version
          # derivation.
          fetch-depth: 0

      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        # Temporarily disabled while debugging the GitHub workflows.
        # Re-enable once the build/release jobs are verified. Uses PyPI Trusted
        # Publishing (OIDC); configure a trusted publisher for this
        # repository/workflow on PyPI (no API token secret required).
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Upload distributions to the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/* --clobber
