name: Deploy Documentation

# Publishes the Sphinx documentation to GitHub Pages, versioned by release tag.
#
# Release tags (vX.Y.Z) publish under /stable/ (released docs).
# Prerelease tags (vX.Y.Z-dev.N) publish under /development/ (pre-release docs).
# Building at the tag lets hatch-vcs derive the exact release version, so the
# docs title shows e.g. 1.0.1 instead of a 1.0.1.devN+g<hash> working version.
#
# Each version is stored in its own subdirectory on the `gh-pages` branch. A run
# reconstructs the full tree (previously published versions plus the version it
# just built), then force-publishes it, so removed pages do not linger and other
# versions are preserved. The site root redirects to /stable/ when it exists and
# otherwise to /development/.
#
# GitHub Pages must be configured to serve from the `gh-pages` branch (root).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Serialize deployments so concurrent release tag pushes do not race when
# reconstructing and publishing the shared gh-pages tree.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Determine version slug
        id: slug
        run: |
          # Tag pushes drive releases: release tags (vX.Y.Z) publish stable,
          # prerelease tags (vX.Y.Z-dev.N, identified by the hyphen) publish
          # development. A manual workflow_dispatch runs against a branch ref and
          # falls back to the branch-name mapping.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              *-*) echo "slug=development" >> "$GITHUB_OUTPUT" ;;
              *) echo "slug=stable" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            case "${GITHUB_REF_NAME}" in
              main) echo "slug=stable" >> "$GITHUB_OUTPUT" ;;
              development) echo "slug=development" >> "$GITHUB_OUTPUT" ;;
              *) echo "slug=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Build HTML documentation
        run: uv run --group docs sphinx-build -b html docs build/html

      - name: Checkout existing published docs
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Assemble versioned site
        run: |
          set -euo pipefail
          # A non-matching glob expands to nothing rather than the literal
          # pattern; the gh-pages checkout leaves an empty directory on the first
          # run before the branch exists.
          shopt -s nullglob
          slug="${{ steps.slug.outputs.slug }}"
          mkdir -p site

          # Carry forward every previously published version except the one being
          # rebuilt in this run.
          for path in gh-pages/*/; do
            name="$(basename "$path")"
            [ "$name" = "${slug}" ] && continue
            cp -r "$path" "site/${name}"
          done

          # Place the freshly built version.
          rm -rf "site/${slug}"
          cp -r build/html "site/${slug}"

          # Serve underscore-prefixed asset directories (Sphinx _static, etc.).
          touch site/.nojekyll

          # Root redirect: prefer stable, fall back to development, then the slug
          # just built.
          if [ -d site/stable ]; then
            target="stable"
          elif [ -d site/development ]; then
            target="development"
          else
            target="${slug}"
          fi
          cat > site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./${target}/">
          <link rel="canonical" href="./${target}/">
          <title>dicom-dre documentation</title>
          <a href="./${target}/">Continue to the documentation</a>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
